<style>
  /* Scene animate a tutto schermo, fondo scuro: la scena 3D riempie la pagina; sopra, l'equazione che si compone
     termine per termine (ogni termine nel colore delle sue frecce); sotto, una riga di commento e le frecce per
     scorrere. Un solo tema, scuro, per scelta. */
  :root {
    --fondo: #0e1116; --testo: #e9edf2; --tenue: #8d98a5; --riga: #2a313b;
    --blu: #58c4dd; --giallo: #ffd866; --rosa: #ff79a8; --verde: #83c167; --rosso: #fc6255; --arancio: #ff9f45; --viola: #b48eff;
    --serif: "Latin Modern Roman", "CMU Serif", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--testo); }
  body { font-family: var(--serif); font-size: 19px; line-height: 1.35; overflow: hidden; position: relative; }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; touch-action: none; }
  .labels { position: absolute; top: 0; left: 0; pointer-events: none; }
  .lbl svg { overflow: visible; display: block; fill: var(--testo); }
  .lbl svg g, .lbl svg use, .lbl svg path { stroke: var(--fondo); stroke-width: 1.1; paint-order: stroke fill; stroke-linejoin: round; }

  /* robot a sinistra, testo a destra: equazione e commento in una colonna centrata in verticale */
  :root { --col: min(44vw, 620px); }
  #view { right: var(--col); }
  #testo { position: absolute; right: 0; top: 0; bottom: 56px; width: var(--col); display: flex; flex-direction: column;
           justify-content: center; gap: 30px; padding: 54px max(28px, env(safe-area-inset-right, 0px)) 20px 12px; pointer-events: none; }
  #sez { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: 58px; font-size: 19px; color: var(--tenue);
         font-variant: small-caps; letter-spacing: 0.08em; pointer-events: none; }
  #conta { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); top: 14px; font-size: 17px; color: var(--tenue);
           font-variant-numeric: tabular-nums; pointer-events: none; }
  /* l'equazione */
  #eq { display: flex; justify-content: flex-start; min-height: 60px; transition: opacity 0.35s; }
  #eq.via { opacity: 0; }
  #eq svg { width: var(--w); max-width: 100%; height: auto; display: block; fill: var(--testo); overflow: visible; }
  #eq svg [fill] { transition: opacity 0.7s; }
  #eq svg .spento { opacity: 0; }
  /* il commento */
  #cap { font-size: 26px; line-height: 1.45; text-wrap: pretty; transition: opacity 0.3s; }
  #cap.via { opacity: 0; }
  #cap span.riga { display: block; max-width: 32ch; }
  .blu { color: var(--blu); } .giallo { color: var(--giallo); } .rosa { color: var(--rosa); } .verde { color: var(--verde); }
  .rosso { color: var(--rosso); } .arancio { color: var(--arancio); } .viola { color: var(--viola); }
  /* punto della derivata: un dischetto alzato sopra la lettera (non dipende dai glifi del font) */
  .nw { white-space: nowrap; }
  i.d1, i.d2 { --dx: -0.27em; --dy: 0.6em; }
  i.maiu { --dx: -0.3em; --dy: 0.82em; }
  i.d1::after, i.d2::after { content: ""; display: inline-block; width: 0.12em; height: 0.12em; border-radius: 50%;
    background: currentColor; position: relative; bottom: var(--dy); left: var(--dx); margin-right: -0.12em; }
  i.d2::after { box-shadow: -0.2em 0 0 currentColor; left: calc(var(--dx) + 0.1em); }
  /* pulsanti dei casi in alto, lettura dal vivo delle forze generalizzate sotto */
  #casi { position: absolute; left: 50%; transform: translateX(-50%); top: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
          max-width: calc(100% - 32px); z-index: 3; }
  #casi button { width: auto; height: auto; font-size: 16px; padding: 6px 14px; border-radius: 999px; }
  #casi button[aria-pressed="true"] { background: var(--testo); color: var(--fondo); border-color: var(--testo); }
  #sez { top: 58px !important; }
  #lettura { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: 88px; font-size: 18px; line-height: 1.5; color: var(--testo);
             font-variant-numeric: tabular-nums; pointer-events: none; }
  #lettura .tenue, .tenue { color: var(--tenue); }
  #testo { padding-top: 70px !important; }
  @media (max-width: 760px) { #casi button { font-size: 13px; padding: 4px 9px; } #sez { top: 92px !important; } #lettura { top: 118px; font-size: 15px; } }
  /* legenda delle frecce */
  #legenda { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: 60px; font-size: 15.5px; color: var(--tenue);
             pointer-events: none; display: flex; flex-direction: column; gap: 2px; transition: opacity 0.4s; }
  #legenda.via { opacity: 0; }
  #legenda svg { vertical-align: -1px; margin-right: 6px; }
  /* navigazione */
  #barra { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
           padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  button { font: inherit; font-size: 20px; line-height: 1; width: 44px; height: 36px; border: 1px solid var(--riga); background: #161b22;
           color: var(--testo); border-radius: 4px; cursor: pointer; }
  button:hover { border-color: var(--tenue); }
  button:focus-visible { outline: 2px solid var(--blu); outline-offset: 2px; }
  button:disabled { opacity: 0.3; cursor: default; }
  #tappe { flex: 1 1 auto; display: flex; gap: 4px; align-items: center; min-width: 0; }
  .tappa { flex: 1 1 0; width: auto; height: 22px; padding: 0; border: none; background: none; position: relative; min-width: 4px; border-radius: 0; }
  .tappa::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 4px; background: var(--riga); border-radius: 2px; }
  .tappa.fatta::before { background: var(--tenue); }
  .tappa.qui::before { background: var(--testo); }
  .tappa.capo { margin-left: 10px; }
  @media (max-width: 760px) {
    :root { --col: 100vw; }
    #view { right: 0; bottom: 46vh; }
    #testo { top: auto; height: 46vh; justify-content: flex-start; gap: 14px; padding: 8px 16px; }
    #cap { font-size: 20px; }
    #legenda { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #eq, #cap, #eq svg [fill] { transition: none; } }
  /* chi ha fatto la pagina: a destra nella barra di navigazione; sui telefoni in una riga sopra la barra */
  #credito { flex: 0 0 auto; font-size: 11.5px; line-height: 1.3; color: var(--tenue); text-align: right; white-space: nowrap; }
  #credito span { display: block; }
  @media (max-width: 760px) {
    #credito { position: absolute; left: 0; right: 0; bottom: 100%; padding: 0 12px 2px; text-align: center; font-size: 10.5px; white-space: normal; }
    #credito span { display: inline; }
    #credito span + span::before { content: " \00b7  "; }
    #testo { bottom: 74px; }
    #view { bottom: calc(46vh + 18px); }
  }
</style>
