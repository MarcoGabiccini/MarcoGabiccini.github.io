<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulazioni del double track — Dinamica dei Veicoli · Università di Pisa</title>
<meta name="description" content="Simulazioni di un modello double track di autoveicolo: animazione 3D, traiettoria, pneumatici e segnali. Corso di Dinamica dei Veicoli, Prof. Marco Gabiccini, Università di Pisa.">
<link rel="icon" href="data:,">
<!-- Tutto locale: la pagina si apre con doppio clic (file://) anche senza rete. -->
<script src="lib/plotly.min.js"></script>
<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/OrbitControls.js"></script>
<style>
  :root {
    --bg: #1e1e24; --bg2: #2a2a33; --bg3: #24242c; --fg: #ddd; --muted: #999;
    --line: #444; --ctl: #3a3a44; --ctlb: #555; --accent: #5ab0ff;
  }
  html, body { margin: 0; height: 100%; font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button, select, input { font: inherit; font-size: 12px; }
  button { background: var(--ctl); color: var(--fg); border: 1px solid var(--ctlb); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  select, input[type=number], input[type=text] { background: var(--bg2); color: var(--fg); border: 1px solid var(--ctlb); border-radius: 4px; padding: 1px 4px; }

  #topbar { padding: 6px 10px; background: var(--bg2); display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  #topbar input[type=range] { flex: 1; min-width: 120px; }
  #topbar .icon { padding: 2px 7px; font-size: 13px; line-height: 1.2; }
  #topbar .icon.attivo { background: #1f4f7a; border-color: var(--accent); color: #fff; box-shadow: 0 0 0 1px var(--accent) inset; }
  #recBox { display: flex; align-items: center; gap: 3px; white-space: nowrap; font-size: 12px; cursor: pointer; }
  #recBox.attivo { color: #ff6b6b; font-weight: bold; }
  #recBox.attivo::after { content: "\25CF"; }
  #timeLabel { font-variant-numeric: tabular-nums; min-width: 7.5em; font-size: 13px; }
  #tViewBox { display: flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 12px; }
  #tViewBox input { width: 4.5em; }
  #status { font-size: 12px; opacity: 0.8; max-width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #runbar { padding: 4px 10px; background: var(--bg3); display: flex; align-items: center; gap: 12px; font-size: 12px; flex: 0 0 auto; flex-wrap: wrap; }
  #runbar .runBtn { display: flex; align-items: center; gap: 6px; background: var(--bg2); padding: 1px 8px; }
  #runbar .runBtn.off { opacity: 0.35; }
  #runbar .runBtn .badge { font-size: 10px; padding: 0 4px; border-radius: 3px; background: #444; color: #ccc; }
  #runbar .runBtn .badge.st { background: #5a4a2a; color: #f0d9a0; }
  #runbar .runBtn .rm { color: #888; padding: 0 2px; }
  #runbar .runBtn .rm:hover { color: #ff6b6b; }
  #runSlots { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #customBox { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 220px; }
  #customExpr { flex: 1; min-width: 100px; font-family: monospace; }
  #customErr { color: #ff6b6b; }
  #provaBox select { max-width: 30em; }
  #credito { color: var(--muted); text-decoration: none; white-space: nowrap; }
  #credito[href]:hover { color: var(--fg); text-decoration: underline; }

  #layout { flex: 1 1 auto; display: flex; min-height: 0; }
  #left { flex: 0 0 42%; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
  #animWrap { flex: 1 1 58%; min-height: 160px; position: relative; background: #141418; }
  #anim3d { display: block; width: 100%; height: 100%; }
  #animCtl { position: absolute; left: 6px; top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    font-size: 11px; background: rgba(20,20,26,0.72); padding: 4px 6px; border-radius: 5px; max-width: calc(100% - 24px); }
  #animCtl select { font-size: 11px; }
  #animCtl label { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  #esag { width: 80px; }
  /* l'ombra tiene leggibili le scritte anche sopra i cordoli bianchi della pista */
  #animHint { position: absolute; left: 8px; bottom: 6px; font-size: 11px; opacity: 0.65; pointer-events: none; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  #animLegend { position: absolute; right: 8px; bottom: 6px; font-size: 11px; opacity: 0.8; pointer-events: none; text-align: right;
    text-shadow: 0 0 3px #000, 0 0 2px #000; }
  #trajWrap { flex: 1 1 42%; min-height: 120px; border-top: 1px solid var(--line); position: relative; }
  #trajPlot { width: 100%; height: 100%; }

  #right { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #tyreSec { flex: 1 1 52%; min-height: 0; display: grid; grid-template-columns: 1fr 1fr minmax(150px, 0.55fr);
    grid-template-rows: 1fr 1fr; border-bottom: 1px solid var(--line); }
  #sigSec { flex: 1 1 48%; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
  #right.solo-segnali #tyreSec { display: none; }
  #right.solo-segnali #sigSec { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
  #right.solo-pneumatici #sigSec { display: none; }
  /* solo 3D: l'animazione prende tutta la finestra */
  #layout.solo-3d #right, #layout.solo-3d #trajWrap { display: none; }
  #layout.solo-3d #left { flex: 1 1 100%; border-right: none; }
  #layout.solo-3d #animWrap { flex: 1 1 auto; height: auto; }

  .wheelCard { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .wheelCard header { font-size: 11px; padding: 2px 6px; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; }
  .wheelCard header b { font-size: 12px; }
  .wheelCard header .info { color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
  .wheelCard .cvs { flex: 1; display: flex; min-height: 0; }
  /* i canvas stanno in contenitori posizionati: la loro risoluzione non deve allargare la griglia */
  .cw { position: relative; min-width: 0; min-height: 0; }
  .cw canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .wheelCard .fcw { flex: 0 0 44%; }
  .wheelCard .mfw { flex: 1 1 56%; }
  #loadCard { grid-column: 3; grid-row: 1 / span 2; display: flex; flex-direction: column; min-height: 0; }
  #loadCard header { font-size: 12px; padding: 2px 6px; font-weight: bold; }
  #loadCard .loadw { flex: 1; }
  #loadInfo { font-size: 11px; padding: 3px 6px 5px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.45; }
  #tyreLegend { font-size: 10.5px; padding: 4px 6px 6px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); }
  #tyreLegend b { color: #ccc; }
  /* stato del pneumatico, "oltre il picco" o "bloccata": lo sfondo è il colore dello stato (pneumatici.js) */
  .wheelCard header .stato { color: #1e1e24; font-weight: bold; border-radius: 3px; padding: 0 4px; }
  .wheelCard header .stato[hidden] { display: none; }

  .slot { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .slot select { margin: 3px 26px 2px 4px; font-size: 11px; }
  .slot .plot { flex: 1; min-height: 0; }
  .legInfo { position: absolute; right: 5px; top: 4px; z-index: 10; width: 16px; height: 16px; border-radius: 50%;
    border: 1px solid #777; color: #bbb; font: italic bold 11px/16px serif; text-align: center; cursor: default; display: none; }
  .legInfo .legBox { display: none; position: absolute; right: 0; top: 20px; background: var(--bg2); border: 1px solid var(--ctlb);
    border-radius: 4px; padding: 6px 8px; font: 11px sans-serif; color: var(--fg); white-space: nowrap; text-align: left; }
  .legInfo:hover .legBox { display: block; }
  .legBox svg { vertical-align: middle; margin-right: 6px; }

  #dropHint { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 22px;
    background: rgba(30,30,36,0.85); border: 3px dashed var(--accent); z-index: 100; }
  body.dragging #dropHint { display: flex; }

  @media (max-width: 1100px) {
    #layout { flex-direction: column; overflow-y: auto; }
    #left { flex: 0 0 auto; border-right: none; }
    #animWrap { height: 50vh; flex: none; }
    #trajWrap { height: 40vh; flex: none; }
    #right { flex: 0 0 auto; }
    #tyreSec { height: 70vh; flex: none; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr auto; }
    #loadCard { grid-column: 1 / span 2; grid-row: 3; height: 34vh; }
    #sigSec { height: 90vh; flex: none; grid-template-columns: 1fr; grid-template-rows: repeat(6, 1fr); }
  }
</style>
</head>
<body>
<div id="topbar">
  <button id="btnInizio" class="icon" disabled title="Torna all'inizio (Home)">&#x23EE;&#xFE0E;</button>
  <button id="btnPlay" class="icon" disabled title="Avvia (barra spaziatrice)">&#9654;</button>
  <button id="btnPause" class="icon" disabled title="Pausa (barra spaziatrice)">&#10074;&#10074;</button>
  <button id="btnLoop" class="icon" disabled aria-pressed="false" title="Ripetizione continua (L): con il loop attivo la riproduzione ricomincia dall'inizio quando arriva in fondo">&#8634;</button>
  <label id="recBox" title="Registra un video della pagina così com'è. Con la spunta, ▶ chiede al browser il permesso di catturare questa scheda e registra dall'avvio fino alla fine della simulazione (con il loop attivo: finché non si mette in pausa). Il video finisce nella cartella dei download."><input type="checkbox" id="chkRec">registra</label>
  <select id="velSel" disabled title="Velocità di riproduzione">
    <option value="0.1">0.1&times;</option><option value="0.25">0.25&times;</option><option value="0.5">0.5&times;</option>
    <option value="1" selected>1&times;</option><option value="2">2&times;</option>
  </select>
  <span>t</span><input type="range" id="timeSlider" min="0" max="0" value="0" step="1" disabled title="Tempo (frecce: un campione)">
  <span id="timeLabel">–</span>
  <span id="tViewBox" title="Finestra temporale dei pannelli dei segnali">
    zoom t <input type="number" id="tView0" step="any" disabled> &ndash; <input type="number" id="tView1" step="any" disabled> s
    <button id="btnTView" disabled>Applica</button><button id="btnTFull" disabled>Tutto</button>
  </span>
  <span id="status">Caricamento…</span>
</div>
<div id="runbar">
  <label id="provaBox" hidden>prova <select id="provaSel"></select></label>
  <span id="runSlots"></span>
  <button id="btnOpen" title="Carica uno o più CSV della cartella risultati/ (si possono anche trascinare sulla pagina). Veicolo, coni e pista di ogni CSV arrivano dal file .js con lo stesso nome che gli sta accanto.">Apri CSV…</button>
  <input type="file" id="fileInput" accept=".csv" multiple hidden>
  <label title="Run seguita dalla telecamera 3D e base dei tempi">riferimento <select id="refSel"></select></label>
  <label>pannelli <select id="panelSel">
    <option value="entrambi">pneumatici + segnali</option>
    <option value="solo-pneumatici">solo pneumatici</option>
    <option value="solo-segnali">solo segnali</option>
    <option value="solo-3d">solo 3D</option>
  </select></label>
  <span id="customBox" title="Espressione sulle colonne della run, in unità SI (angoli in rad). Funzioni di Math senza prefisso: sin, atan2, sqrt, PI... Invio per applicare.">
    custom = <input type="text" id="customExpr" spellcheck="false" placeholder="es. Y_11 + Y_12">
    <button id="btnCustom">Applica</button><span id="customErr"></span>
  </span>
  <a id="credito" hidden target="_blank" rel="noopener"></a>
</div>
<div id="layout">
  <div id="left">
    <div id="animWrap">
      <canvas id="anim3d"></canvas>
      <div id="animCtl">
        <label>vista <select id="camSel">
          <option value="insegui">inseguimento</option>
          <option value="alto">dall'alto</option>
          <option value="lato">laterale</option>
          <option value="dietro">da dietro</option>
        </select></label>
        <label>auto <select id="meshSel">
          <option value="lowpoly">Ghibli low-poly</option>
          <option value="completa">Ghibli completa</option>
          <option value="procedurale">procedurale</option>
        </select></label>
        <label title="Fattore di esagerazione di rollio (phi1, phi2) e beccheggio (theta) della cassa">esagerazione
          <input type="range" id="esag" min="0" max="10" step="0.5" value="2"><span id="esagVal">2&times;</span></label>
        <label><input type="checkbox" id="chkForze" checked>forze</label>
        <label><input type="checkbox" id="chkScie" checked>traiettorie</label>
      </div>
      <div id="animHint"></div>
      <div id="animLegend"></div>
    </div>
    <div id="trajWrap"><div id="trajPlot"></div></div>
  </div>
  <div id="right">
    <div id="tyreSec">
      <div class="wheelCard" data-ij="11"></div>
      <div class="wheelCard" data-ij="12"></div>
      <div class="wheelCard" data-ij="21"></div>
      <div class="wheelCard" data-ij="22"></div>
      <div id="loadCard">
        <header title="Z_ij meno il carico statico della ruota">Trasferimenti di carico</header>
        <canvas id="loadCanvas"></canvas>
        <div id="loadInfo"></div>
        <div id="tyreLegend"></div>
      </div>
    </div>
    <div id="sigSec"></div>
  </div>
</div>
<div id="dropHint">Rilascia i CSV per caricarli</div>

<script src="js/dati.js"></script>
<script src="js/grafici.js"></script>
<script src="js/pneumatici.js"></script>
<script src="js/scena3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
