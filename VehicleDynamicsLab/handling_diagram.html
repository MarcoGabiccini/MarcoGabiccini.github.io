<template id="aiuto-par" data-titolo="Due modi di dare la stessa caratteristica">
<h4><span class="n">1</span>La Magic Formula</h4>
<p>Ogni assale ha la sua caratteristica $F_{yi}(\alpha_i) = D\sin\bigl(C\arctan(B\alpha - E(B\alpha - \arctan B\alpha))\bigr)$.
I quattro coefficienti hanno un nome (rigidezza $B$, forma $C$, picco $D$, curvatura $E$), ma tranne $D$ non si leggono sulla curva.</p>
<h4><span class="n">2</span>Le grandezze della curva</h4>
<p>Le stesse caratteristiche si possono dare con quattro grandezze che <b>si vedono</b> sul grafico:</p>
<ul>
<li>$y'(0)$: la pendenza nell'origine, cio&egrave; la rigidezza di deriva dell'assale;</li>
<li>$y_m$: il valore di picco, raggiunto alla deriva $x_m$;</li>
<li>$y_a$: il valore a cui la curva tende per derive grandi (asintoto).</li>
</ul>
<p>Con il bottone &laquo;Grandezze della curva&raquo; i cursori diventano questi quattro; la riga sotto i cursori d&agrave; sempre i valori dell'altra parametrizzazione.</p>
<h4><span class="n">3</span>Il dizionario</h4>
<p>Dai coefficienti alla curva: $y'(0) = BCD$, $y_m = D$, $y_a = D\sin(C\pi/2)$; $x_m$ &egrave; dove $C\arctan(\ldots) = \pi/2$.</p>
<p>Dalla curva ai coefficienti: $D = y_m$, $C = 2 - \frac{2}{\pi}\arcsin\frac{y_a}{y_m}$, $B = \frac{y'(0)}{C\,D}$, $E = \frac{B x_m - \tan\frac{\pi}{2C}}{B x_m - \arctan B x_m}$.</p>
<p>$E$ non entra in $y'(0)$ n&eacute; in $y_a$: sposta il picco e decide quanto &egrave; arrotondato il ginocchio.</p>
<h4><span class="n">4</span>I limiti</h4>
<p>Il dizionario vale se la curva ha un picco: $y_a &lt; y_m$ (cio&egrave; $1 &lt; C &lt; 3$) ed $E &lt; 1$. Per questo il cursore di $y_a$ va da $-0.6\,y_m$ a $0.99\,y_m$, e quello di $x_m$ si restringe da solo all'intervallo in cui $E$ resta fra $-1 - C^2/2$ e $0.98$.
Sotto $-1 - C^2/2$ la curva partirebbe convessa, sopra la sua tangente nell'origine: un picco troppo vicino all'origine, a parit&agrave; di pendenza, chiede proprio questo.</p>
<h4><span class="n">5</span>Che cosa non &egrave;</h4>
<p>Non &egrave; un altro modello: la curva &egrave; la stessa, cambia solo che cosa si tiene fermo quando si muove un cursore.
Con le grandezze della curva, muovere $y_m$ a $y_a$ fermo cambia anche $C$, $B$ ed $E$; l'asintoto si raggiunge per $\alpha \to \infty$, oltre i 20&deg; del grafico.</p>
</template>

<template id="aiuto-car" data-titolo="Caratteristiche normalizzate degli assali">
<h4><span class="n">1</span>Che cosa si vede</h4>
<p>Per ogni assale la forza laterale divisa per il suo carico statico, $F_{yi}/W_i$, in funzione della deriva $\alpha_i$:
<span class="sw" style="border-color:#e94560"></span>assale 1 (anteriore), <span class="sw" style="border-color:#00b4d8"></span>assale 2 (posteriore).
I carichi statici sono $W_1 = mg\,a_2/l$ e $W_2 = mg\,a_1/l$.</p>
<h4><span class="n">2</span>Perch&eacute; normalizzare</h4>
<p>A regime $F_{y1}/W_1 = F_{y2}/W_2 = \tilde a_y/g$: alla stessa accelerazione laterale i due assali lavorano alla <b>stessa quota</b>.
Il cursore <span class="sw" style="border-color:#06d6a0"></span>fissa la quota e taglia le due curve.</p>
<h4><span class="n">3</span>I punti</h4>
<p>$P_i$ sta sul tratto crescente della curva dell'assale $i$, $Q_i$ su quello calante, se la curva ridiscende sotto la quota entro i 20&deg; del grafico.
Sopra il picco di un assale la quota non taglia pi&ugrave; la sua curva: a regime quell'assale non d&agrave; tanta forza.</p>
<h4><span class="n">4</span>Le frecce</h4>
<p>Una freccia orizzontale per ogni coppia, con la <b>coda nel punto dell'assale 2</b> e la <b>punta in quello dell'assale 1</b>:
&egrave; la differenza $\Delta\alpha = \alpha_1 - \alpha_2$. Per esempio $P_1P_2 = \alpha_{P_1} - \alpha_{P_2}$. Punta verso destra se $\Delta\alpha &gt; 0$.</p>
<ul>
<li><span class="sw" style="border-color:#ffdd57"></span>$P_1P_2$: crescente &minus; crescente</li>
<li><span class="sw" style="border-color:#ff9f1c"></span>$P_1Q_2$: crescente &minus; calante</li>
<li><span class="sw" style="border-color:#f15bb5"></span>$Q_1P_2$: calante &minus; crescente</li>
<li><span class="sw" style="border-color:#9b5de5"></span>$Q_1Q_2$: calante &minus; calante</li>
</ul>
<p>Le stesse frecce, con gli stessi colori, si ritrovano nel diagramma a destra.</p>
<h4><span class="n">5</span>Le grandezze della curva</h4>
<p>Con la casella del pannello dei parametri compaiono, per ogni assale: la tangente nell'origine (pendenza $y'(0)$, la rigidezza di deriva), il picco $(x_m, y_m)$ e l'asintoto $y_a$, tutti divisi per $W_i$.
Con il bottone &laquo;Grandezze della curva&raquo; sono loro i cursori: si vede subito che cosa cambia nel diagramma quando si sposta il picco di un assale o la sua rigidezza.</p>
<h4><span class="n">6</span>Che cosa non &egrave;</h4>
<p>Le frecce non sono forze n&eacute; spostamenti nel tempo: sono differenze di angoli alla stessa quota.
Le curve non dipendono da $u$ n&eacute; da $\delta$: sono caratteristiche d'assale (l'eventuale trasferimento di carico &egrave; gi&agrave; dentro la curva), e $W_i$ serve solo a normalizzare.</p>
</template>

<template id="aiuto-hd" data-titolo="Handling diagram">
<h4><span class="n">1</span>Che cosa si vede</h4>
<p>Ogni coppia di punti alla quota del cursore d&agrave; un punto $(\Delta\alpha,\ \tilde a_y/g)$ del diagramma.
Facendo salire la quota da zero, i punti tracciano i <b>rami</b>:</p>
<ul>
<li><span class="sw" style="border-color:#ffdd57"></span>$P_1P_2$: <b>ramo primario</b>, entrambi gli assali sul tratto crescente; parte dall'origine</li>
<li><span class="sw" style="border-color:#ff9f1c"></span>$P_1Q_2$ e <span class="sw" style="border-color:#f15bb5"></span>$Q_1P_2$: rami secondari, un assale oltre il picco</li>
<li><span class="sw" style="border-color:#9b5de5"></span>$Q_1Q_2$: entrambi oltre il picco</li>
</ul>
<p>Il ramo primario arriva fino alla quota del picco pi&ugrave; basso: sopra non c'&egrave; pi&ugrave; un $P$ per entrambi gli assali.</p>
<h4><span class="n">2</span>L'asse orizzontale</h4>
<p>$\Delta\alpha = \alpha_1 - \alpha_2$ &egrave; <b>positivo verso sinistra</b>; verso destra si legge $l/R$.
Cos&igrave; la retta di regime $\tilde a_y/g = \frac{u^2}{g\,l}(\delta - \Delta\alpha)$ sale verso destra con pendenza $u^2/(g\,l)$ e taglia l'asse in $\Delta\alpha = \delta$.</p>
<h4><span class="n">3</span>Le frecce</h4>
<p>Dalla verticale $\Delta\alpha = 0$ al punto: &egrave; la stessa differenza $\alpha_1 - \alpha_2$ della freccia a sinistra, con lo stesso colore.
Qui compare <b>specchiata</b>, perch&eacute; l'asse $\Delta\alpha$ &egrave; rivolto a sinistra: una freccia che a sinistra punta verso destra ($\Delta\alpha &gt; 0$) qui punta verso sinistra.
La linea punteggiata la porta sul punto del ramo, alla quota del cursore.</p>
<h4><span class="n">4</span>Come si legge</h4>
<p>Ramo primario a sinistra di $\Delta\alpha = 0$: $\alpha_1 &gt; \alpha_2$, serve pi&ugrave; sterzo del cinematico $l/R$, <b>sottosterzo</b>. A destra: <b>sovrasterzo</b>.
Vicino all'origine il ramo &egrave; una retta di pendenza $d\Delta\alpha/d(\tilde a_y/g) = g\,K_\gamma$, il gradiente di sottosterzo del monotraccia lineare.</p>
<h4><span class="n">5</span>A che cosa serve</h4>
<p>Il diagramma dipende solo dal veicolo, non da $u$ n&eacute; da $\delta$: si costruisce una volta per tutte.
Gli equilibri di regime sono le sue intersezioni con la retta &laquo;ballerina&raquo;, che si sposta con $u$ e $\delta$ (widget <i>handling_equilibrium</i>).</p>

// ===================================================================

//  Magic Formula B, C, D, E  <->  grandezze della curva y_m, x_m, y_a, y'(0)

//                      E = (B x_m - tan(pi/(2C))) / (B x_m - arctan(B x_m))

// ===================================================================
//  Modello: curve normalizzate, picchi, rami dell'handling diagram (con le derive

// ===================================================================
let MODEL = null, MODEL_KEY = '';
function model() {
  const key = chiaveP();
  if (key !== MODEL_KEY) { MODEL = calcola(getParams()); MODEL_KEY = key; }
  return MODEL;
}
function calcola(p) {
  const l = p.a1 + p.a2, W1 = p.m * G * p.a2 / l, W2 = p.m * G * p.a1 / l;
  const v1 = campiona(p.B1, p.C1, p.D1, p.E1, W1), v2 = campiona(p.B2, p.C2, p.D2, p.E2, W2);
  const pk1 = picco(v1, p.B1, p.C1, p.D1, p.E1, W1), pk2 = picco(v2, p.B2, p.C2, p.D2, p.E2, W2);
  const etaMax = Math.max(pk1.v, pk2.v);
  const rami = PAIRS.map(() => []);
  rami[0].push({ da: 0, eta: 0, a1: 0, a2: 0 });
  for (const eta of quoteRami(v1, v2, Math.min(pk1.v, pk2.v))) {
    const a1s = tagli(v1, pk1, eta), a2s = tagli(v2, pk2, eta);
    PAIRS.forEach((pr, b) => {
      if (a1s.length > pr.i && a2s.length > pr.j) rami[b].push({ da: a1s[pr.i] - a2s[pr.j], eta, a1: a1s[pr.i], a2: a2s[pr.j] });
    });
  }
  let daMin = 0, daMax = 0;
  for (const r of rami) for (const q of r) { daMin = Math.min(daMin, q.da); daMax = Math.max(daMax, q.da); }
  const marg = Math.max(1, (daMax - daMin) * 0.15);
  daMin = Math.min(-1, Math.floor((daMin - marg) * 2) / 2);
  daMax = Math.max(1, Math.ceil((daMax + marg) * 2) / 2);
  const cs1 = p.B1 * p.C1 * p.D1, cs2 = p.B2 * p.C2 * p.D2;
  const gK = (W1 / cs1 - W2 / cs2) / RAD;          // g K_gamma = W1/C1 - W2/C2, in gradi per g
  return { p, l, W1, W2, v1, v2, pk1, pk2, etaMax, rami, daMin, daMax, cs1, cs2, gK };
}
// g K_gamma locale (gradi per g) con le derive alpha_1, alpha_2 (gradi): W1/Phi1 - W2/Phi2
function gKlocale(M, a1, a2) {
  const p = M.p, Ph1 = dFy(a1 * RAD, p.B1, p.C1, p.D1, p.E1), Ph2 = dFy(a2 * RAD, p.B2, p.C2, p.D2, p.E2);
  return { Ph1, Ph2, g: (M.W1 / Ph1 - M.W2 / Ph2) / RAD };
}
// punti e coppie alla quota eta: ogni coppia ha da = alpha_1 - alpha_2, oppure null se manca un punto
function alCursore(M, eta) {
  const a1s = tagli(M.v1, M.pk1, eta), a2s = tagli(M.v2, M.pk2, eta);
  const coppie = PAIRS.map((pr, b) => Object.assign({ b }, pr,
    (a1s.length > pr.i && a2s.length > pr.j) ? { da: a1s[pr.i] - a2s[pr.j], a1: a1s[pr.i], a2: a2s[pr.j] } : { da: null }));
  return { a1s, a2s, coppie };
}

// ===================================================================
//  Disegno: strumenti
// ===================================================================
const canvas = $('main-canvas'), ctx = canvas.getContext('2d');
let CW = 800, CH = 400, LAY = null;
function resize() {
  const c = $('canvas-strip'), dpr = window.devicePixelRatio || 1;
  CW = Math.max(c.clientWidth - 12, 420); CH = Math.max(c.clientHeight - 12, 200);
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  canvas.width = Math.round(CW * dpr); canvas.height = Math.round(CH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function linea(x0, y0, x1, y1, col, lw, dash) {
  ctx.save(); ctx.setLineDash(dash || []); ctx.strokeStyle = col; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
}
function testo(t, x, y, col, font, align) {
  ctx.save(); ctx.font = font; ctx.textAlign = align || 'left';
  ctx.lineJoin = 'round'; ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(13,17,23,.92)'; ctx.strokeText(t, x, y);
  ctx.fillStyle = col; ctx.fillText(t, x, y); ctx.restore();
}
function pallino(x, y, r, col) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
}
function anello(x, y, r, col, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.strokeStyle = 'rgba(13,17,23,.9)'; ctx.lineWidth = lw + 2.5; ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
}
// freccia orizzontale dalla coda x0 alla punta x1, alla quota y; troppo corta: solo un segno.
// estremi = true: due trattini (quota |<->| come nelle figure del deck)
function freccia(x0, x1, y, col, estremi) {
  const L = Math.abs(x1 - x0), s = Math.sign(x1 - x0) || 1;
  ctx.save(); ctx.lineCap = 'round';
  if (L < 7) {
    linea(x0, y - 4, x0, y + 4, 'rgba(13,17,23,.9)', 4.5); linea(x0, y - 4, x0, y + 4, col, 2);
    ctx.restore(); return;
  }
  const hx = x1 - s * 7;
  linea(x0, y, hx, y, 'rgba(13,17,23,.9)', 5.5);
  linea(x0, y - 3.5, x0, y + 3.5, 'rgba(13,17,23,.9)', 4.5);
  linea(x0, y, hx, y, col, 2.2);
  linea(x0, y - 3.5, x0, y + 3.5, col, 1.6);                     // coda: un trattino
  if (estremi) linea(x1, y - 4.5, x1, y + 4.5, col, 1.6);
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(hx, y - 4.5); ctx.lineTo(hx, y + 4.5); ctx.closePath();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(13,17,23,.9)'; ctx.stroke(); ctx.fillStyle = col; ctx.fill();
  ctx.restore();
}
// etichetta di una freccia: fuori dalla freccia, dal lato dove c'e' posto nel riquadro [xa, xb];
// se non c'e' posto da nessuna parte (freccia lunga), sopra la freccia, a meta', con il fondo scuro
function etichettaFreccia(t, x0, x1, y, col, xa, xb) {
  ctx.font = 'bold 10.5px "Segoe UI"';
  const w = ctx.measureText(t).width, lo = Math.min(x0, x1), hi = Math.max(x0, x1);
  let x = hi + 7;
  if (x + w > xb - 2) x = lo - 7 - w;
  if (x < xa + 2) {
    x = Math.max(xa + 2, Math.min(xb - 2 - w, (lo + hi) / 2 - w / 2));
    ctx.fillStyle = '#0d1117'; ctx.fillRect(x - 4, y - 7, w + 8, 14);
  }
  testo(t, x, y + 3.5, col, 'bold 10.5px "Segoe UI"');
}

// ===================================================================
//  Impaginazione: due grafici affiancati con la stessa ordinata a~_y/g.
//  A destra Delta alpha positivo verso SINISTRA (x di pagina = -Delta alpha).
// ===================================================================
function impagina(M, daMin, daMax, padBextra) {
  const W = CW, H = CH;
  const yMax = Math.ceil(M.etaMax * 1.15 * 10) / 10, yStep = yMax > 1.5 ? 0.2 : 0.1;
  const gap = 58, padL = 52, padR = 42, padT = 30, padB = 34 + (padBextra || 0);
  const totW = W - padL - padR - gap, pwL = Math.floor(totW * 0.47), pwR = totW - pwL, ph = H - padT - padB;
  const LX0 = padL, RX0 = padL + pwL + gap, Y0 = padT, YB = Y0 + ph;
  LAY = { W, H, yMax, yStep, LX0, RX0, pwL, pwR, Y0, YB, ph, daMin, daMax,
    toY: v => YB - v / yMax * ph,
    toXL: a => LX0 + a / ALPHA_MAX * pwL,
    toXR: da => RX0 + (daMax - da) / (daMax - daMin) * pwR };
  return LAY;
}

// grafico di sinistra: griglia, assi, le due caratteristiche normalizzate e, a richiesta,
// le grandezze della curva (tangente nell'origine, picco, asintoto)
function disegnaCaratteristiche(M, L) {
  const { LX0, pwL, Y0, YB, ph, yMax, yStep, toY, toXL, H } = L;
  testo('Caratteristiche normalizzate degli assali', LX0, 19, '#dfe6f5', '600 12.5px "Segoe UI"');
  for (let d = 0; d <= ALPHA_MAX; d += 2) linea(toXL(d), Y0, toXL(d), YB, 'rgba(255,255,255,.07)', 1);
  for (let v = 0; v <= yMax + 1e-3; v += yStep) linea(LX0, toY(v), LX0 + pwL, toY(v), 'rgba(255,255,255,.07)', 1);
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(LX0, Y0); ctx.lineTo(LX0, YB); ctx.lineTo(LX0 + pwL, YB); ctx.stroke();
  ctx.font = '11px "Segoe UI"'; ctx.fillStyle = '#888'; ctx.textAlign = 'center';
  for (let d = 0; d <= ALPHA_MAX; d += 4) ctx.fillText(d + '°', toXL(d), YB + 14);
  ctx.textAlign = 'right'; ctx.font = '11px monospace';
  for (let v = 0; v <= yMax + 1e-3; v += yStep) ctx.fillText(v.toFixed(1), LX0 - 5, toY(v) + 4);
  ctx.font = 'italic 12px "Segoe UI"'; ctx.fillStyle = '#aaa';
  ctx.fillText('αᵢ (deg)', LX0 + pwL, H - 5);
  ctx.save(); ctx.translate(12, Y0 + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center';
  ctx.fillText('Fyᵢ / Wᵢ = ãy / g', 0, 0); ctx.restore();
  ctx.textAlign = 'left';
  for (const [v, col] of [[M.v1, COL1], [M.v2, COL2]]) {
    ctx.beginPath();
    for (let k = 0; k <= NS; k += 8) { const x = toXL(k * DA), y = toY(v[k]); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
  }
  {   // nomi delle curve sopra i picchi
    const x1 = toXL(M.pk1.a), x2 = toXL(M.pk2.a), y1 = toY(M.pk1.v) - 7, y2 = toY(M.pk2.v) - 7, primo1 = x1 <= x2;
    testo('assale 1', x1 + (primo1 ? -3 : 3), y1, COL1, 'bold 10.5px "Segoe UI"', primo1 ? 'right' : 'left');
    testo('assale 2', x2 + (primo1 ? 3 : -3), y2, COL2, 'bold 10.5px "Segoe UI"', primo1 ? 'left' : 'right');
  }
  if (opt.grandezze) disegnaGrandezze(M, L);
}
function disegnaGrandezze(M, L) {
  const { LX0, pwL, Y0, YB, yMax, toY, toXL } = L, f = 'italic bold 11px "Segoe UI"';
  for (const i of [1, 2]) {
    const q = CQ[i], W = M['W' + i], col = i === 1 ? COL1 : COL2, k = i - 1;
    const ym = q.ym / W, xm = q.xm / RAD, ya = q.ya / W, pend = q.yp / W * RAD;     // pendenza per grado
    // tangente nell'origine: y'(0)
    const yEnd = Math.min(1.12 * ym, yMax * 0.98), aEnd = Math.min(ALPHA_MAX, yEnd / pend);
    linea(toXL(0), toY(0), toXL(aEnd), toY(aEnd * pend), col, 1.3, [6, 4]);
    testo("y'(0)", toXL(aEnd) + (i === 1 ? 5 : -5), toY(aEnd * pend) + (i === 1 ? 4 : -2), col, f, i === 1 ? 'left' : 'right');
    // picco: y_m a x_m
    const xp = toXL(xm), yp = toY(ym);
    linea(LX0, yp, xp, yp, col, 1, [2, 3]);
    linea(xp, yp, xp, YB, col, 1, [2, 3]);
    anello(xp, yp, 4.5, col, 1.8);
    testo('yₘ', LX0 + 4 + 22 * k, yp + (i === 1 ? -4 : 12), col, f);
    testo('xₘ', xp, YB - 5 - 13 * k, col, f, 'center');
    // asintoto: y_a (si raggiunge per alpha -> infinito)
    if (ya > 0) {
      linea(xp, toY(ya), LX0 + pwL, toY(ya), col, 1.2, [8, 3, 2, 3]);
      testo('yₐ', LX0 + pwL - 4, toY(ya) + (i === 1 ? -4 : 12), col, f, 'right');
    } else {
      testo(`yₐ = ${ya.toFixed(2)}·W${i === 1 ? '₁' : '₂'} (sotto l'asse)`, LX0 + pwL - 4, YB - 18 - 13 * k, col, 'italic 10.5px "Segoe UI"', 'right');
    }
  }
}

// grafico di destra: griglia e assi dell'handling diagram
function disegnaAssiHD(M, L, titolo) {
  const { RX0, pwR, Y0, YB, ph, yMax, yStep, toY, toXR, daMin, daMax, H } = L;
  testo(titolo || 'Handling diagram', RX0, 19, '#dfe6f5', '600 12.5px "Segoe UI"');
  for (let d = Math.ceil(daMin); d <= Math.floor(daMax); d++) linea(toXR(d), Y0, toXR(d), YB, 'rgba(255,255,255,.07)', 1);
  for (let v = 0; v <= yMax + 1e-3; v += yStep) linea(RX0, toY(v), RX0 + pwR, toY(v), 'rgba(255,255,255,.07)', 1);
  linea(RX0, YB, RX0 + pwR, YB, 'rgba(255,255,255,.45)', 1.5);
  if (daMin < 0 && daMax > 0) {
    linea(toXR(0), Y0, toXR(0), YB, 'rgba(255,255,255,.32)', 1.3);
    testo('Δα = 0', toXR(0), Y0 - 3, '#99a', '10px "Segoe UI"', 'center');
  }
  ctx.font = '11px "Segoe UI"'; ctx.textAlign = 'center';
  const pxGrado = pwR / (daMax - daMin), passoDa = [1, 2, 4, 5, 10, 20].find(s => s * pxGrado >= 34) || 20;
  for (let d = Math.ceil(daMin / passoDa) * passoDa; d <= daMax; d += passoDa) {
    ctx.fillStyle = d === 0 ? '#bbb' : '#888'; ctx.fillText(d + '°', toXR(d), YB + 14);
  }
  ctx.textAlign = 'left'; ctx.fillStyle = '#888'; ctx.font = '11px monospace';
  for (let v = 0; v <= yMax + 1e-3; v += yStep) ctx.fillText(v.toFixed(1), RX0 + pwR + 5, toY(v) + 4);
  ctx.font = 'italic 12px "Segoe UI"'; ctx.fillStyle = '#aaa';
  ctx.fillText('← Δα = α₁ − α₂', RX0 + 2, H - 5);
  ctx.textAlign = 'right'; ctx.fillText('l / R →', RX0 + pwR, H - 5);
  ctx.save(); ctx.translate(RX0 + pwR + 36, Y0 + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center';
  ctx.fillText('ãy / g', 0, 0); ctx.restore();
  ctx.textAlign = 'left';
}
// pannelli comuni: il caso (comportamento a basse a~_y, quale assale satura prima), carichi, rigidezze
function pannelloCaso(M) {
  const tipo = M.gK > 0.01 ? 'sottosterzante' : (M.gK < -0.01 ? 'sovrasterzante' : 'neutro');
  $('caso-tipo').innerHTML = `A basse &atilde;<sub>y</sub>: <b>${tipo}</b>. Pendenza iniziale del ramo primario `
    + `g&thinsp;K<sub>&gamma;</sub> = <b>${fmt(M.gK)}/g</b>${modificato() ? ' <i>(parametri modificati)</i>' : ''}.`;
  const d = M.pk1.v - M.pk2.v, pmin = Math.min(M.pk1.v, M.pk2.v);
  if (Math.abs(d) < 0.003)
    $('caso-picchi').innerHTML = `Picchi uguali (${M.pk1.v.toFixed(3)}): i due assali saturano alla stessa quota, fin l&igrave; arriva il ramo primario.`;
  else {
    const i = d > 0 ? 2 : 1;
    $('caso-picchi').innerHTML = `Satura prima l'<b>assale ${i}</b> (${i === 1 ? 'anteriore' : 'posteriore'}): picco ${pmin.toFixed(3)} `
      + `contro ${Math.max(M.pk1.v, M.pk2.v).toFixed(3)}. Il ramo primario arriva fino a &atilde;<sub>y</sub>/g = ${pmin.toFixed(3)}.`;
  }
  $('carichi').innerHTML = `Carichi statici: W<sub>1</sub> = mg&thinsp;a<sub>2</sub>/l = ${M.W1.toFixed(0)} N, W<sub>2</sub> = mg&thinsp;a<sub>1</sub>/l = ${M.W2.toFixed(0)} N.`;
  $('rigidezze').innerHTML = `Rigidezze di deriva y'(0) = B&thinsp;C&thinsp;D: C<sub>&alpha;1</sub> = ${(M.cs1 / 1000).toFixed(1)} kN/rad, `
    + `C<sub>&alpha;2</sub> = ${(M.cs2 / 1000).toFixed(1)} kN/rad.<br>Picchi delle curve normalizzate: assale 1 ${M.pk1.v.toFixed(3)} a ${M.pk1.a.toFixed(1)}&deg;, `
    + `assale 2 ${M.pk2.v.toFixed(3)} a ${M.pk2.a.toFixed(1)}&deg;.<br>g&thinsp;K<sub>&gamma;</sub> = W<sub>1</sub>/C<sub>&alpha;1</sub> &minus; W<sub>2</sub>/C<sub>&alpha;2</sub> = ${fmt(M.gK)}/g.`;
}
// ===================================================================
//  Gradiente di sottosterzo locale lungo i rami: g K_gamma = W1/Phi1 - W2/Phi2
//  (gradi per g), colore per segno; i rami di handling_equilibrium e handling_steering
// ===================================================================
const COL_SOTTO = '#06d6a0', COL_NEUTRO = '#ffdd57', COL_SOVRA = '#ff4d6d';
const SOGLIA_NEUTRO = 0.15;        // |g K_gamma| (gradi per g) sotto cui un tratto di ramo e' "neutro"
const colKg = g => !isFinite(g) ? COL_NEUTRO : (g > SOGLIA_NEUTRO ? COL_SOTTO : (g < -SOGLIA_NEUTRO ? COL_SOVRA : COL_NEUTRO));
// un ramo a tratti di colore diverso (un tratto per colore, senza giunture visibili)
function ramoATratti(r, colore, lw, alpha) {
  if (r.length < 2) return;
  const { toXR, toY } = LAY;
  ctx.save(); ctx.globalAlpha = alpha; ctx.lineWidth = lw; ctx.lineJoin = 'round';
  const tratto = (da, a, col) => {
    ctx.beginPath();
    for (let k = da; k <= a; k++) { const x = toXR(r[k].da), y = toY(r[k].eta); k === da ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.strokeStyle = col; ctx.stroke();
  };
  let c = colore(r[0]), k0 = 0;
  for (let k = 1; k < r.length; k++) {
    const ck = colore(r[k]);
    if (ck !== c || k === r.length - 1) { tratto(k0, k, c); k0 = k; c = ck; }
  }
  ctx.restore();
}
// punti a K_gamma = 0: il gradiente passa per zero (non per l'infinito, come ai picchi, dove Phi = 0)
function segnaNeutri(M) {
  const { toXR, toY } = LAY;
  M.rami.forEach(r => {
    for (let k = 1; k < r.length - 1; k++) {
      const g0 = gKlocale(M, r[k].a1, r[k].a2).g, g1 = gKlocale(M, r[k + 1].a1, r[k + 1].a2).g;
      if (g0 * g1 < 0 && Math.abs(g0 - g1) < 3) {
        const t = g0 / (g0 - g1), x = toXR(r[k].da + t * (r[k + 1].da - r[k].da)), y = toY(r[k].eta + t * (r[k + 1].eta - r[k].eta));
        pallino(x, y, 3.5, COL_NEUTRO); testo('Kγ = 0', x + 7, y + 4, COL_NEUTRO, 'bold 9.5px "Segoe UI"');
      }
    }
  });
}
function tracciaRamo(pts, col, lw, alpha, dash) {
  if (pts.length < 2) return;
  const { toXR, toY } = LAY;
  ctx.save(); ctx.globalAlpha = alpha; ctx.setLineDash(dash || []); ctx.beginPath();
  pts.forEach((q, k) => { const x = toXR(q.da), y = toY(q.eta); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
}

// ===================================================================
//  Costruzione dell'handling diagram: la parte di questo widget
// ===================================================================
const CON_JZ = false;
const opt = { frecce: true, traccia: true, fantasma: true, grandezze: false };
const COLCUR = '#06d6a0', DURATA = 9;          // colore del cursore; s per salire da zero al picco piu' alto

// ---------- quota, animazione, opzioni ----------
const slider = $('ayg-slider');
function setEta(v) { slider.value = v; $('ayg-val').textContent = (+slider.value).toFixed(3); draw(); }
slider.addEventListener('input', () => { ferma(); setEta(+slider.value); });
$('b-zero').addEventListener('click', () => { ferma(); setEta(0); });
let inMoto = false, raf = null, tPrec = null;
function ferma() { inMoto = false; if (raf) cancelAnimationFrame(raf); raf = null; $('b-play').innerHTML = '&#9654;'; $('b-play').classList.remove('on'); }
function avvia() {
  if (+slider.value >= +slider.max - 1e-3) setEta(0);
  inMoto = true; tPrec = null; $('b-play').innerHTML = '&#10074;&#10074;'; $('b-play').classList.add('on');
  raf = requestAnimationFrame(passo);
}
function passo(t) {
  if (!inMoto) return;
  if (tPrec === null) tPrec = t;
  const dt = Math.min(0.05, (t - tPrec) / 1000); tPrec = t;
  const max = +slider.max, v = Math.min(max, +slider.value + dt * max / DURATA);
  setEta(v);
  if (v >= max) { ferma(); return; }
  raf = requestAnimationFrame(passo);
}
$('b-play').addEventListener('click', () => inMoto ? ferma() : avvia());
for (const [id, k] of [['chk-frecce', 'frecce'], ['chk-traccia', 'traccia'], ['chk-fantasma', 'fantasma']])
  $(id).addEventListener('change', e => { opt[k] = e.target.checked; draw(); });

function draw() {
  const W = CW, H = CH;
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);
  const M = model();
  // il cursore va da zero al picco piu' alto
  const nuovoMax = (Math.ceil(M.etaMax * 1000) / 1000).toFixed(3);
  if (slider.max !== nuovoMax) { slider.max = nuovoMax; if (+slider.value > +nuovoMax) slider.value = nuovoMax; }
  const eta = +slider.value;
  $('ayg-val').textContent = eta.toFixed(3);
  const L = impagina(M, M.daMin, M.daMax, 0);
  const { LX0, RX0, pwL, pwR, YB, yMax, toY, toXL, toXR } = L;
  posizionaBottoni();
  disegnaCaratteristiche(M, L);
  disegnaAssiHD(M, L);

  // ---------- rami dell'handling diagram ----------
  const C = alCursore(M, eta);
  for (let b = PAIRS.length - 1; b >= 0; b--) {
    const pr = PAIRS[b], r = M.rami[b];
    if (!opt.traccia) { tracciaRamo(r, pr.col, pr.lw, 1); continue; }
    if (opt.fantasma) tracciaRamo(r, pr.col, pr.lw, 0.28);
    const parte = r.filter(q => q.eta <= eta);
    if (C.coppie[b].da !== null && eta > 0) parte.push({ da: C.coppie[b].da, eta });
    tracciaRamo(parte, pr.col, pr.lw, 1);
  }

  // ---------- cursore, punti, frecce ----------
  if (eta > 0 && eta <= yMax) {
    const y = toY(eta);
    linea(LX0, y, LX0 + pwL, y, 'rgba(6,214,160,.6)', 1.5);
    linea(RX0, y, RX0 + pwR, y, 'rgba(6,214,160,.6)', 1.5);
    linea(LX0 + pwL, y, RX0, y, 'rgba(6,214,160,.25)', 1, [4, 4]);
    for (const a of C.a1s) linea(toXL(a), y, toXL(a), YB, 'rgba(233,69,96,.4)', 1, [3, 3]);
    for (const a of C.a2s) linea(toXL(a), y, toXL(a), YB, 'rgba(0,180,216,.4)', 1, [3, 3]);

    // frecce sotto la linea del cursore se c'e' posto, se no sopra; i nomi dei punti dall'altra parte
    const pres = C.coppie.filter(c => c.da !== null);
    const giu = y + 14 + 12 * Math.max(0, pres.length - 1) + 8 <= YB;
    const verso = giu ? 1 : -1;
    pres.forEach((c, k) => { c.off = verso * (14 + 12 * k); });

    // nomi dei punti sulle caratteristiche, su piu' righe se si sovrappongono
    const nomi = [...C.a1s.map((a, k) => ({ x: toXL(a), t: NOMI1[k] || 'R₁', col: COL1 })),
                  ...C.a2s.map((a, k) => ({ x: toXL(a), t: NOMI2[k] || 'R₂', col: COL2 }))].sort((p, q) => p.x - q.x);
    const righe = [];
    ctx.font = 'bold 11px "Segoe UI"';
    for (const n of nomi) {
      const w = ctx.measureText(n.t).width;
      let r = 0; while (righe[r] !== undefined && righe[r] > n.x - w / 2 - 3) r++;
      righe[r] = n.x + w / 2;
      const yy = verso > 0 ? y - 7 - 11 * r : y + 15 + 11 * r;
      testo(n.t, n.x, yy, n.col, 'bold 11px "Segoe UI"', 'center');
    }

    if (opt.frecce) {
      for (const c of pres) {
        const ya = y + c.off, et = c.nome + ' = ' + fmt(c.da);
        // a sinistra: coda sul punto dell'assale 2, punta su quello dell'assale 1
        freccia(toXL(c.a2), toXL(c.a1), ya, c.col);
        etichettaFreccia(et, toXL(c.a2), toXL(c.a1), ya, c.col, LX0, LX0 + pwL);
        // a destra: dalla verticale Delta alpha = 0 al punto (asse rivolto a sinistra: specchiata)
        const xp = toXR(c.da);
        linea(xp, ya, xp, y, c.col, 1, [2, 3]);
        freccia(toXR(0), xp, ya, c.col);
        etichettaFreccia(et, toXR(0), xp, ya, c.col, RX0, RX0 + pwR);
      }
    }
    for (const a of C.a1s) pallino(toXL(a), y, 5, COL1);
    for (const a of C.a2s) pallino(toXL(a), y, 5, COL2);
    for (const c of pres) {
      const xp = toXR(c.da);
      if (xp < RX0 - 1 || xp > RX0 + pwR + 1) continue;
      pallino(xp, y, 5, c.col);
      if (!opt.frecce) testo(c.nome, xp, y - 9, c.col, 'bold 11px "Segoe UI"', 'center');
    }
    testo(eta.toFixed(3), LX0 + 4, y - 5, COLCUR, 'bold 10px monospace');
  }
  aggiornaPannelli(M, eta, C);
}

// ===================================================================
//  Pannelli: il caso, la quota del cursore
// ===================================================================
function aggiornaPannelli(M, eta, C) {
  pannelloCaso(M);
  $('quota').innerHTML = `&atilde;<sub>y</sub>/g = ${eta.toFixed(3)} &nbsp;&rarr;&nbsp; &atilde;<sub>y</sub> = ${(eta * G).toFixed(2)} m/s&sup2;`;
  // una riga per assale: P sul tratto crescente, Q su quello calante
  const cella = (arr, k, n) => `<td class="v">${arr.length > k ? `${n}&ensp;${arr[k].toFixed(2)}&deg;` : '&mdash;'}</td>`;
  $('tab-punti').innerHTML = `<tr><th>Derive</th><th>tratto crescente</th><th>tratto calante</th></tr>`
    + `<tr><td><span class="pal" style="background:${COL1}"></span>assale 1: &alpha;<sub>1</sub></td>${cella(C.a1s, 0, 'P<sub>1</sub>')}${cella(C.a1s, 1, 'Q<sub>1</sub>')}</tr>`
    + `<tr><td><span class="pal" style="background:${COL2}"></span>assale 2: &alpha;<sub>2</sub></td>${cella(C.a2s, 0, 'P<sub>2</sub>')}${cella(C.a2s, 1, 'Q<sub>2</sub>')}</tr>`;
  let righe = `<tr><th>Coppia</th><th>&Delta;&alpha; = &alpha;<sub>1</sub> &minus; &alpha;<sub>2</sub></th><th style="text-align:left">ramo</th></tr>`;
  for (const c of C.coppie)
    righe += `<tr class="${c.da === null ? 'assente' : ''}"><td><span class="sw" style="border-color:${c.col}"></span>${sub(c.nome)}</td>`
      + `<td class="v">${c.da === null ? '&mdash;' : fmt(c.da)}</td><td class="r">${c.ramo} (${c.fasi})</td></tr>`;
  $('tab-coppie').innerHTML = righe;
  const pmin = Math.min(M.pk1.v, M.pk2.v);
  $('avviso').innerHTML = eta > pmin + 1e-6
    ? `Sopra il picco dell'assale ${M.pk1.v < M.pk2.v ? 1 : 2}: la sua curva non si taglia pi&ugrave;, quindi nessuna coppia. A regime questa &atilde;<sub>y</sub>/g non si raggiunge.` : '';
  if (Aiuto.aperto) Aiuto.adesso();
}
function testoAdesso() {
  const M = MODEL, tipo = M.gK > 0.01 ? 'sottosterzante' : (M.gK < -0.01 ? 'sovrasterzante' : 'neutro');
  return `<b>Adesso</b> (${CASI[currentMode]}${modificato() ? ', modificato' : ''}): `
    + `g&thinsp;K<sub>&gamma;</sub> = ${fmt(M.gK)}/g, ramo primario ${tipo} vicino all'origine; arriva fino a &atilde;<sub>y</sub>/g = ${Math.min(M.pk1.v, M.pk2.v).toFixed(3)}.`;
}

// ===================================================================
//  Help: ogni "?" apre la sua scheda (testo nel <template id="aiuto-...">).
//  Quella di un grafico si apre sopra l'altro grafico, cosi' quello spiegato resta
//  scoperto; quella di un pannello sopra i grafici. Si sposta trascinandone la testata.
//  Un elemento #aiuto-adesso nella scheda riceve i numeri del caso corrente
//  (funzione testoAdesso del widget, se c'e').
// ===================================================================
function posizionaBottoni() {
  if (!LAY) return;
  const ox = canvas.offsetLeft, oy = canvas.offsetTop;
  for (const b of document.querySelectorAll('.aiuto-b')) {
    const x = b.dataset.aiuto === 'car' ? LAY.LX0 + LAY.pwL - 22 : LAY.RX0 + LAY.pwR - 22;
    b.style.left = (ox + x) + 'px'; b.style.top = (oy + 5) + 'px';
  }
}
const Aiuto = {
  aperto: null, spostata: false, bottone: null,
  apri(id, bottone) {
    if (this.aperto === id) return this.chiudi();
    const box = $('aiuto'), corpo = box.querySelector('.corpo'), tpl = $('aiuto-' + id);
    this.aperto = id; this.spostata = false; this.bottone = bottone || null;
    box.querySelector('.testa .t').textContent = tpl.dataset.titolo;
    corpo.replaceChildren(tpl.content.cloneNode(true));
    const dec = s => s.replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&amp;/g, '&');   // innerHTML riscrive > come &gt;
    if (window.katex) corpo.innerHTML = corpo.innerHTML.replace(/\$([^$]+)\$/g, (m, s) => katex.renderToString(dec(s), { throwOnError: false }));
    corpo.scrollTop = 0;
    document.querySelectorAll('.aiuto-b, .aiuto-p').forEach(b => b.classList.toggle('on', b.dataset.aiuto === id));
    box.classList.add('on');
    this.adesso();
    this.posiziona();
  },
  chiudi() {
    this.aperto = null; $('aiuto').classList.remove('on');
    document.querySelectorAll('.aiuto-b, .aiuto-p').forEach(b => b.classList.remove('on'));
  },
  adesso() {
    const el = document.getElementById('aiuto-adesso');
    if (el && MODEL && typeof testoAdesso === 'function') el.innerHTML = testoAdesso(this.aperto);
  },
  posiziona() {
    if (!this.aperto || this.spostata || !LAY) return;
    const box = $('aiuto'), r = canvas.getBoundingClientRect();
    let w, left;
    if (this.aperto === 'car' || this.aperto === 'hd') {
      const sopraHd = this.aperto === 'car';
      const x0 = r.left + (sopraHd ? LAY.RX0 - 10 : LAY.LX0 - 10), wDisp = (sopraHd ? LAY.pwR : LAY.pwL) + 20;
      w = Math.min(600, Math.max(380, wDisp)); left = x0;
    } else {                                   // scheda di un pannello: sopra i grafici, verso il suo "?"
      w = Math.min(560, window.innerWidth - 16);
      const bx = this.bottone ? this.bottone.getBoundingClientRect().left : window.innerWidth / 2;
      left = bx - w / 2;
    }
    left = Math.max(8, Math.min(window.innerWidth - w - 8, left));
    Object.assign(box.style, { width: w + 'px', left: left + 'px', top: (r.top + 6) + 'px', maxHeight: Math.max(220, window.innerHeight - r.top - 16) + 'px' });
  },
  init() {
    document.querySelectorAll('.aiuto-b, .aiuto-p').forEach(b => b.addEventListener('click', e => { e.preventDefault(); this.apri(b.dataset.aiuto, b); }));
    const box = $('aiuto'), testa = box.querySelector('.testa');
    box.querySelector('.x').addEventListener('click', () => this.chiudi());
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && this.aperto) this.chiudi(); });
    let presa = null;
    testa.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      const rr = box.getBoundingClientRect();
      presa = { dx: e.clientX - rr.left, dy: e.clientY - rr.top }; testa.setPointerCapture(e.pointerId);
    });
    testa.addEventListener('pointermove', e => {
      if (!presa) return;
      this.spostata = true;
      const top = Math.max(0, Math.min(window.innerHeight - 40, e.clientY - presa.dy));
      Object.assign(box.style, { left: (e.clientX - presa.dx) + 'px', top: top + 'px', maxHeight: (window.innerHeight - top - 10) + 'px' });
    });
    const fine = () => { presa = null; };
    testa.addEventListener('pointerup', fine); testa.addEventListener('pointercancel', fine);
  },
};

// ===================================================================
//  Divisore orizzontale: trascina per dare piu' spazio ai grafici o ai pannelli;
//  doppio clic chiude o riapre i pannelli. L'altezza scelta resta in proporzione.
// ===================================================================
function divisore() {
  const splitter = $('h-splitter'), bot = $('bottom-strip');
  let frazione = 0.38, presa = null;
  const altezza = () => Math.max(190, Math.min(440, window.innerHeight * frazione));
  const applica = h => { bot.style.flexBasis = h + 'px'; resize(); draw(); Aiuto.posiziona(); };
  bot.style.flexBasis = altezza() + 'px';
  splitter.addEventListener('pointerdown', e => {
    presa = { y: e.clientY, h: bot.getBoundingClientRect().height };
    bot.classList.remove('chiuso'); splitter.classList.add('active'); splitter.setPointerCapture(e.pointerId); e.preventDefault();
  });
  splitter.addEventListener('pointermove', e => {
    if (!presa) return;
    const h = Math.max(0, Math.min(window.innerHeight - 180, presa.h - (e.clientY - presa.y)));
    frazione = h / window.innerHeight; applica(h);
  });
  const fine = () => {
    if (!presa) return; presa = null; splitter.classList.remove('active');
    if (bot.getBoundingClientRect().height < 50) { bot.classList.add('chiuso'); frazione = 0.38; bot.style.flexBasis = altezza() + 'px'; resize(); draw(); }
  };
  splitter.addEventListener('pointerup', fine); splitter.addEventListener('pointercancel', fine);
  splitter.addEventListener('dblclick', () => { bot.classList.toggle('chiuso'); resize(); draw(); Aiuto.posiziona(); });
  window.addEventListener('resize', () => { if (!bot.classList.contains('chiuso')) bot.style.flexBasis = altezza() + 'px'; resize(); draw(); Aiuto.posiziona(); });
}

// ===================================================================
//  Avvio
// ===================================================================
Aiuto.init();
renderFormula();
divisore();
resize();
inizializzaParametri(CON_JZ, draw);
setMode('under1');
</script>
